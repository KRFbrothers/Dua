name: dua
description: "Dua — private Offline / Online / Voice assistant (Flutter scaffold)."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.4.9
  connectivity_plus: ^7.3.1
  http: ^1.6.0
  cupertino_icons: ^1.0.8
  permission_handler: ^13.0.2
  photo_manager: ^3.12.0
  path_provider: ^2.1.5
  path: ^1.9.1
  open_filex: ^4.7.0
  installed_apps: ^2.1.1
  disk_space_2: ^1.0.13
  flutter_secure_storage: ^10.3.4
  speech_to_text: ^7.4.0
  flutter_tts: ^4.2.5
  share_plus: ^12.0.2
  image_picker: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
